name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-14
            artifact: nitedrive-macos-universal
          - name: Windows
            os: windows-latest
            artifact: nitedrive-windows-x64
          - name: Linux
            os: ubuntu-22.04
            artifact: nitedrive-linux-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libjack-jackd2-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libfreetype6-dev libfontconfig1-dev \
            libglu1-mesa-dev mesa-common-dev

      # JUCE is fetched by CMake; caching it keeps the fetch off the critical path.
      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=$BUILD_TYPE
        shell: bash

      - name: Build plugin
        run: cmake --build build --config $BUILD_TYPE --parallel 4
        shell: bash

      # The DSP suite is the real gate: it measures aliasing, filter tuning and
      # envelope timing rather than just checking the thing links.
      - name: Run DSP verification
        run: ctest --test-dir build --build-config $BUILD_TYPE --output-on-failure
        shell: bash

      - name: Collect artefacts
        shell: bash
        run: |
          mkdir -p dist
          find build -name "*.vst3" -maxdepth 6 -exec cp -R {} dist/ \; || true
          find build -name "*.component" -maxdepth 6 -exec cp -R {} dist/ \; || true
          ls -R dist

      # Signing has two modes. With a Developer ID certificate in the repo secrets
      # the bundles are properly signed with a hardened runtime, which is what
      # notarisation requires. Without one - forks, or before the secrets are set -
      # it falls back to ad-hoc signing so the build still produces something
      # loadable. Either way the AU must be signed: JUCE only ad-hoc signs the VST3
      # (as a side effect of regenerating moduleinfo.json) and Apple Silicon refuses
      # to load an unsigned bundle at all.
      - name: Sign macOS bundles
        if: runner.os == 'macOS'
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          SIGN_ID: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail

          if [ -z "${CERT_P12:-}" ]; then
            echo "::notice::No Developer ID certificate in secrets - ad-hoc signing."
            for b in dist/NITEDRIVE.vst3 dist/NITEDRIVE.component; do
              codesign --force --sign - --timestamp=none "$b"
              codesign --verify --strict --verbose=2 "$b"
            done
            echo "SIGNED_WITH_DEVELOPER_ID=false" >> "$GITHUB_ENV"
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PWD="$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"

          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PWD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

          # --options runtime enables the hardened runtime, without which Apple will
          # reject the notarisation submission.
          for b in dist/NITEDRIVE.vst3 dist/NITEDRIVE.component; do
            codesign --force --timestamp --options runtime --sign "$SIGN_ID" "$b"
            codesign --verify --strict --verbose=2 "$b"
          done

          echo "SIGNED_WITH_DEVELOPER_ID=true" >> "$GITHUB_ENV"

      # Notarisation is what lets the plugin load on someone else's Mac without them
      # having to strip the quarantine flag by hand. Stapling attaches the ticket to
      # the bundle so it validates offline.
      - name: Notarise and staple
        if: runner.os == 'macOS' && env.SIGNED_WITH_DEVELOPER_ID == 'true'
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          if [ -n "${NOTARY_KEY:-}" ]; then
            echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            AUTH=(--key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID")
          elif [ -n "${APPLE_ID:-}" ]; then
            AUTH=(--apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID")
          else
            echo "::warning::Signed with Developer ID but no notarisation credentials - skipping notarisation."
            exit 0
          fi

          for b in NITEDRIVE.vst3 NITEDRIVE.component; do
            # ditto, not zip: it preserves the bundle structure Apple expects.
            ditto -c -k --keepParent "dist/$b" "$RUNNER_TEMP/$b.zip"
            xcrun notarytool submit "$RUNNER_TEMP/$b.zip" "${AUTH[@]}" --wait --timeout 30m
            xcrun stapler staple "dist/$b"
            xcrun stapler validate "dist/$b"
          done

          rm -f "$RUNNER_TEMP/notary.p8"
          echo "::notice::Bundles notarised and stapled - no quarantine workaround needed."

      - name: Verify macOS bundles are universal and signed
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          for fmt in vst3 component; do
            BUNDLE="dist/NITEDRIVE.$fmt"
            BIN="$BUNDLE/Contents/MacOS/NITEDRIVE"
            echo "== $fmt =="
            lipo -info "$BIN"
            lipo -info "$BIN" | grep -q "x86_64"
            lipo -info "$BIN" | grep -q "arm64"
            test -d "$BUNDLE/Contents/_CodeSignature"
            codesign --verify --strict --verbose=2 "$BUNDLE"
            codesign --display --verbose=2 "$BUNDLE" 2>&1 | grep -E "Authority|Signature|TeamIdentifier" || true
            if [ "${SIGNED_WITH_DEVELOPER_ID:-false}" = "true" ]; then
              # A notarised, stapled bundle loads on any Mac with no user intervention.
              xcrun stapler validate "$BUNDLE" \
                && echo "  stapled: yes" \
                || echo "::warning::$fmt is signed but not stapled - users will need the xattr step."
            fi
          done

      # auval is what macOS itself runs before a host will list an Audio Unit, so
      # this is the definitive check that the .component actually loads - including
      # that its signature is acceptable to Apple Silicon.
      - name: Validate the Audio Unit with auval
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R dist/NITEDRIVE.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 5
          auval -v aumu Ntdr Ndrv

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist
          if-no-files-found: error

  validate:
    name: pluginval (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.os == 'macos-14' && 'nitedrive-macos-universal' || 'nitedrive-windows-x64' }}
          path: dist

      # pluginval exercises the plugin wrapper itself: parameter threading, state
      # restore, editor open/close, odd block sizes and sample rates.
      - name: Run pluginval (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -sL "https://github.com/Tracktion/pluginval/releases/download/v1.0.3/pluginval_macOS.zip" -o pluginval.zip
          unzip -q pluginval.zip
          pluginval.app/Contents/MacOS/pluginval \
            --strictness-level 10 --validate-in-process --timeout-ms 600000 \
            --validate "dist/NITEDRIVE.vst3"

      # Expand-Archive rather than unzip, which is not on the Windows runners.
      - name: Run pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/v1.0.3/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive -Path pluginval.zip -DestinationPath . -Force
          ./pluginval.exe --strictness-level 10 --validate-in-process --timeout-ms 600000 --validate "dist/NITEDRIVE.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
